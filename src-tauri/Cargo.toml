[package]
name = "zmail"
version = "0.1.7"
description = "zMail — an AI-first email client"
authors = ["Zach Rossmiller"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form"] }
keyring = { version = "3", features = ["apple-native"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rand = "0.10"
sha2 = "0.10"
base64 = "0.22"
url = "2"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.0"
# Meaning-based search: EmbeddingGemma 2 on llama.cpp (Metal). Pinned: the vendored
# llama-cpp-sys-2 below is this exact version with a newer llama.cpp (vendor/README.md).
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["metal"] }
regex = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSError", "NSBundle", "NSPredicate", "NSDate", "NSDictionary", "NSUserDefaults", "NSValue", "NSPathUtilities"] }
objc2-contacts = { version = "0.3", features = ["CNContactStore", "CNContact", "block2"] }
objc2-map-kit = { version = "0.3", features = ["MKDirections", "MKDirectionsRequest", "MKDirectionsResponse", "MKDirectionsTypes", "MKLocalSearch", "MKLocalSearchRequest", "MKLocalSearchResponse", "MKMapItem", "MKAddress", "MKTypes", "block2", "objc2-core-location"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[lints.clippy]
# On top of `cargo clippy -D warnings` (pnpm verify): a few stricter lints that fit this crate.
# Pedantic as a whole isn't on: most of its hits are Tauri command arguments, which must be owned.
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
ignore_without_reason = "warn"
redundant_clone = "warn"
needless_collect = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"

[patch.crates-io]
# llama.cpp b11461, which loads EmbeddingGemma 2 (`gemma-embedding2`); see vendor/README.md.
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }

# Its build script compiles llama.cpp optimized either way; without debug info that's the
# plain Release build type instead of RelWithDebInfo, which builds faster and links smaller.
[profile.dev.package.llama-cpp-sys-2]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc macros and build scripts run at build time only. Xcode 27's strip leaves their dylibs
# unloadable ("mis-aligned LINKEDIT string pool"), which breaks `tauri build`.
[profile.release.build-override]
strip = false
